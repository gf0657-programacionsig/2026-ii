        - file: contenidos/i-introduccion-ciencia-datos-programacion/03-cuadernos-jupyter.md
        - file: contenidos/i-introduccion-ciencia-datos-programacion/04-markdown.md
        - file: contenidos/i-introduccion-ciencia-datos-programacion/05-git-github.md
        - file: contenidos/i-introduccion-ciencia-datos-programacion/06-introduccion-programacion.md
        - file: contenidos/i-introduccion-ciencia-datos-programacion/07-asistentes-ia.md
    - title: Evaluaciones
      children:
        - file: contenidos/evaluaciones/examen-corto-01.md
    - title: Software
      children:
        - file: contenidos/software/colab.md
        - file: contenidos/software/vscode.md
    - title: Soluciones a los ejercicios
      children:
        - file: contenidos/soluciones/01-soluciones-introduccion-ciencia-datos.md
        - file: contenidos/soluciones/02-soluciones-ejemplo-procesos-ciencia-datos.md
        - file: contenidos/soluciones/03-soluciones-cuadernos-jupyter.md
        - file: contenidos/soluciones/04-soluciones-markdown.md
